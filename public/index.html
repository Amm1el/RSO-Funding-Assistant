<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSO Funding Assistant</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #5f5f5a; --accent: #782f40; --card: #fff; --line: #e3e1da; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ededea; --muted: #a3a29c; --accent: #e3b5bf; --card: #1f1f1d; --line: #33322f; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .answer { margin-top: 24px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); white-space: pre-wrap; }
    .unanswered { border-style: dashed; }
    ul.cites { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: .92rem; }
    .examples button { background: transparent; color: var(--accent); padding: 4px 0; font-weight: 500; text-align: left; }
  </style>
</head>
<body>
  <main>
    <h1>RSO Funding Assistant</h1>
    <p class="sub">Answers about FSU SGA funding, cited from the 2026-27 RSO Financial Manual. Not official SGA advice.</p>
    <form id="f">
      <input id="q" name="q" placeholder="e.g. How much can RSOAC give per student for travel?" autocomplete="off" required minlength="3" maxlength="500" />
      <button id="go">Ask</button>
    </form>
    <div class="examples" id="ex"></div>
    <div id="out"></div>
  </main>
  <script>
    const examples = ["What is the most our RSO can get from RSOAC this year?", "Can we buy food for a meeting with 6 people?", "What is the maximum hotel rate per night?"];
    const ex = document.getElementById("ex");
    for (const e of examples) { const b = document.createElement("button"); b.type = "button"; b.textContent = e; b.onclick = () => { q.value = e; f.requestSubmit(); }; ex.appendChild(b); ex.appendChild(document.createElement("br")); }
    const f = document.getElementById("f"), q = document.getElementById("q"), go = document.getElementById("go"), out = document.getElementById("out");
    f.addEventListener("submit", async (e) => {
      e.preventDefault(); go.disabled = true; out.innerHTML = "";
      try {
        const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q.value }) });
        const data = await res.json();
        const box = document.createElement("div"); box.className = "answer" + (data.answerable ? "" : " unanswered");
        box.textContent = data.answer ?? data.error;
        if (data.citations?.length) {
          const ul = document.createElement("ul"); ul.className = "cites";
          for (const c of data.citations) { const li = document.createElement("li"); li.textContent = `${c.section}, p. ${c.pages}: “${c.quote}”`; ul.appendChild(li); }
          box.appendChild(ul);
        }
        out.appendChild(box);
      } catch { out.textContent = "Something went wrong. Try again."; }
      finally { go.disabled = false; }
    });
  </script>
</body>
</html>
